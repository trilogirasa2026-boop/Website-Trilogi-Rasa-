<style>
:root{--gold:#E8A317;--green:#1F4D3A;--cream:#FBF6EC;--terra:#C8553D;--ink:#2B2B2B;--card:#fff;--line:#e7dfcf;--r:16px}
body.dark{--cream:#16201b;--ink:#f1ece0;--card:#22302a;--line:#35463e}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding-bottom:76px}
h1,h2,h3,.logo{font-family:Fraunces,Georgia,serif;margin:0}
header{background:var(--green);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:22px}.logo i{font-style:normal;color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:5}

button{font:inherit;cursor:pointer}

.hero h1{font-size:34px;line-height:1.1;margin-bottom:8px}.hero p{margin:0 0 16px;opacity:.92;max-width:64ch;line-height:1.6}
.hero .banner{background:var(--terra);display:inline-block;border-radius:10px;padding:4px 12px;font-size:13px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;min-height:40px;white-space:nowrap}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 10px #0001;overflow:hidden;border:1px solid var(--line)}
.card .ph{aspect-ratio:4/3;width:100%;display:flex;align-items:center;justify-content:center;font-size:72px;background-size:contain;background-repeat:no-repeat;background-position:center;position:relative}
.card .bd{padding:12px}.card h3{font-size:17px}.muted{opacity:.65;font-size:13px}
.tag{position:absolute;top:8px;left:8px;background:var(--gold);color:#2B2B2B;font:600 11px Inter;padding:2px 10px;border-radius:99px}
.tag.x{background:#2B2B2B;color:#fff}
.pr{font-weight:600;color:var(--terra)}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:800px){.split{grid-template-columns:1.6fr 1fr}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.row>*{flex:0 0 auto}.sp{justify-content:space-between}

input,select,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--cream);color:var(--ink);min-height:44px}
label{display:block;font-size:13px;margin-top:10px;font-weight:500}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);color:var(--ink)}
.badge.ok{background:#d7ecdf;color:#1F4D3A}.badge.warn{background:#fbe3a8;color:#6b4a00}.badge.bad{background:#f4d2ca;color:#8a2d1b}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px}
.empty{text-align:center;padding:36px 10px;opacity:.7}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:20px 12px}
#md>div{background:var(--card);color:var(--ink);border-radius:20px;padding:18px;width:100%;max-width:440px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#2B2B2B;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:30}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.rc{background:#fff;color:#000;font:12px/1.4 'Courier New',monospace;padding:12px;margin:10px auto;border:1px dashed #999}
.rc.w58{width:219px}.rc.w80{width:302px}.rc.wA5{width:100%;max-width:560px;font-size:14px}
.rc h3{text-align:center;font-size:18px}.rc .c{text-align:center}.rc hr{border:0;border-top:1px dashed #000}.rc .l{display:flex;justify-content:space-between;gap:6px}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;margin:0;border:0}}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold)}
</style>
</head>

const D=()=>({set:{brand:'Trilogi Rasa',tagline:'Gurih, Legit, Segar. Kenyal Semua.',v:2,heroTitle:'Selamat Datang di Trilogi Rasa',heroSub:'Trilogi Rasa menyajikan tiga sajian khas: Dimsumin dengan saus kaludu kulit udang yang gurih, Ngoltime ongol-ongol yang manis dan legit, serta Bonfit jamu sirup Bonagung yang menyegarkan. Silakan pilih menu favorit Anda, pesan langsung, atau jadwalkan pre-order untuk acara Anda.',banner:'Paket Trilogi: 1 dimsum + 1 ongol-ongol + 1 minuman dengan harga hemat',outlet:'Trilogi Rasa – Booth Mall',address:'Alamat outlet (ubah di Pengaturan)',ig:'@trilogirasa',wa:'6281234567890',tax:0,keepHours:3,pinAdmin:'1234',pinKasir:'1111',rek:'BCA 000000000 a.n. Trilogi Rasa',footer:'Terima kasih sudah jajan di Trilogi Rasa!',waTpl:'Halo {nama}, pesanan {kode} (total {total}) statusnya: {status}. Terima kasih!'},

S.fb=S.fb||[];

 IDB.set('S',j).then(()=>okI=1).catch(()=>{okI=0;if(!okL)toast('Gagal menyimpan! Segera unduh cadangan di Admin → Data')});clearTimeout(svT);svT=setTimeout(autoFile,1500);clearTimeout(pT);pT=setTimeout(()=>window.push&&push(),700)}

const log=m=>{S.log.unshift({id:uid()+uid(),t:Date.now(),m,by:(U.role&&U.kasir?U.kasir+' ('+U.role+')':U.role)||'pelanggan'});S.log=S.log.slice(0,200);save()};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const cat=id=>S.cats.find(c=>c.id==id)||{name:'-',color:'#888',emoji:'🍽️'};
const dt=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

function pick(i,k){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);FI[k]=c.toDataURL('image/jpeg',.7);toast('Foto siap')};im.src=r.result};r.readAsDataURL(f)}
let FI={};
function form(t,fs,cb){FI={};openM(`<h3>${t}</h3>`+fs.map(f=>`<label>${f.l}${f.t=='select'?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${e(o[0])}" ${o[0]==f.v?'selected':''}>${e(o[1])}</option>`).join('')}</select>`:f.t=='file'?`<input type=file accept="image/*" onchange="pick(this,'${f.k}')">`:f.t=='area'?`<textarea id="f_${f.k}">${e(f.v)}</textarea>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${e(f.v)}">`}</label>`).join('')+`<div class=row><button class=b2 onclick=closeM()>Batal</button><button class=b1 id=fs>Simpan</button></div>`);
$('#fs').onclick=()=>{fs.forEach(f=>{if(f.t!='file')FI[f.k]=$('#f_'+f.k).value});cb(FI)}}
const ask=(m,fn)=>{openM(`<p>${m}</p><div class=row><button class=b2 onclick=closeM()>Batal</button><button class=b3 id=ok>Ya, lanjut</button></div>`);$('#ok').onclick=()=>{closeM();fn()}};
const op=a=>a.map(x=>[x,x]);
/* ---------- navigasi ---------- */
function go(v){if(v=='pos'&&!['kasir','admin'].includes(U.role))return login('kasir',v);if(v=='admin'&&U.role!='admin')return login('admin',v);U.v=v;render()}
function login(r,v){form('Masuk sebagai '+r,[{k:'pin',l:'PIN',t:'password',v:''}],f=>{if(f.pin==(r=='admin'?S.set.pinAdmin:S.set.pinKasir)){U.role=r;closeM();go(v);if(CFG&&!SY.staff){toast('Masuk juga sebagai staf ☁ agar data tersinkron');setTimeout(syncUI,700)}}else toast('PIN salah')})}
function logout(){U.role='';U.v='menu';render()}
function render(k){
 $('#lg').innerHTML=(S.set.logo?`<img src="${S.set.logo}" alt="" style="height:30px;vertical-align:middle;margin-right:8px;border-radius:6px">`:'')+e(S.set.brand).replace(/ (\S+)$/,' <i>$1</i>');
 $('#rl').innerHTML=U.role?`${U.role} <a href="#" style="color:inherit" onclick="logout();return false">keluar</a>`:'pelanggan';
 const n=S.cart.reduce((a,c)=>a+c.q,0);
 $('#nv').innerHTML=[['menu','🍽️','Menu'],['cart','🛒','Keranjang'+(n?' ('+n+')':'')],['orders','🧾','Pesanan'],['pos','💳','Kasir'],['admin','⚙️','Admin']].map(x=>`<button class="${U.v==x[0]?'on':''}" onclick="go('${x[0]}')"><div style="font-size:20px">${x[1]}</div>${x[2]}</button>`).join('');
 $('#app').innerHTML=({menu:vMenu,cart:()=>cartPane(0),orders:vOrders,pos:vPos,admin:vAdmin})[U.v]();if(!k)scrollTo(0,0);hdr()}
/* ---------- pelanggan ---------- */
const vis=()=>S.menu.filter(m=>!m.arch&&m.status!='Disembunyikan');
function tile(m,k){const c=cat(m.cat),h=k&&U.hab;return `<div class=card><div class=ph style="background-color:${c.color}22;${m.img?`background-image:url(${m.img})`:''}">${m.img?'':c.emoji}${m.label?`<span class=tag>${e(m.label)}</span>`:''}${m.status=='Habis'?'<span class="tag x" style="left:auto;right:8px">Habis</span>':''}</div><div class=bd><div class=muted style="color:${c.color}">${e(c.name)}</div><h3>${e(m.name)}</h3>${k?'':`<div class=muted>${e(m.desc)}</div>`}<div class="row sp"><span class=pr>${rp(m.price)}</span><button class="b1 sm" ${m.status=='Habis'&&!h?'disabled':''} onclick="${h?`togHab('${m.id}')`:`add('${m.id}')`}">${h?(m.status=='Habis'?'Tersedia lagi':'Tandai habis'):'+ Tambah'}</button></div></div></div>`}

function vMenu(){const l=vis().filter(m=>U.cat=='all'||m.cat==U.cat);return `<div class=hero>${S.set.banner?`<div class=banner>${e(S.set.banner)}</div>`:''}<h1>${e(S.set.heroTitle)}</h1><p>${e(S.set.heroSub)}</p><div class=row style="margin:0"><button class=b1 onclick="U.f.type='Makan di Tempat';U.cat='all';scrollTo(0,500)">Pesan Sekarang</button><button class=b2 onclick="U.f.type='Pre-Order';go('cart')">Pre-Order</button></div><p style="margin:14px 0 0;font-style:italic">${e(S.set.tagline)}</p>${U.role=='admin'?'<button class="b2 sm" onclick="heroForm()">✎ Edit sambutan</button>':''}</div>${chips()}<div class=grid>${l.map(m=>tile(m)).join('')||'<div class=empty>Belum ada menu di kategori ini.</div>'}</div><div class=pane style="margin-top:18px;text-align:center"><h3>Punya masukan untuk kami?</h3><p class=muted>Kritik dan saran Anda membantu kami terus berkembang.</p><button class=b1 onclick="fbForm()">Kirim kritik & saran</button></div>`}
function heroForm(){const s=S.set;form('Edit sambutan halaman depan',[{k:'banner',l:'Banner promo (kosongkan untuk menyembunyikan)',v:s.banner},{k:'heroTitle',l:'Judul sambutan',v:s.heroTitle},{k:'heroSub',l:'Kalimat sambutan',t:'area',v:s.heroSub},{k:'tagline',l:'Tagline',v:s.tagline}],f=>{Object.assign(S.set,f);log('Edit sambutan halaman depan');save();closeM();render()})}
function add(id,q=1){const m=S.menu.find(x=>x.id==id),c=S.cart.find(x=>x.id==id);c?c.q+=q:S.cart.push({id,n:m.name,p:m.price,q,note:''});save();toast(m.name+' masuk keranjang');if(U.v!='pos')render();else render()}
function setQ(i,v){v=Math.floor(+v);if(!(v>=0)){toast('Isi angka yang valid');return render(1)}if(v<1)S.cart.splice(i,1);else S.cart[i].q=Math.min(v,9999);save();render(1)}

function addMenu(){openM(amList())}
function amQ(id,d){const m=S.menu.find(x=>x.id==id),i=S.cart.findIndex(x=>x.id==id),sc=$('#amsc'),y=sc?sc.scrollTop:0;if(i<0){if(d>0)S.cart.push({id,n:m.name,p:m.price,q:1,note:''})}else{S.cart[i].q+=d;if(S.cart[i].q<1)S.cart.splice(i,1)}save();render(1);$('#mb').innerHTML=amList();$('#amsc').scrollTop=y}
function customItem(){form('Item custom',[{k:'n',l:'Nama item',v:''},{k:'p',l:'Harga',t:'number',v:''}],f=>{if(!f.n||!(+f.p>=0))return toast('Isi nama & harga');S.cart.push({id:'x'+uid(),n:f.n,p:+f.p,q:1,note:'Custom'});save();closeM();render()})}

function rmBg(c){const w=c.width,h=c.height,x=c.getContext('2d'),im=x.getImageData(0,0,w,h),d=im.data,T=50;let r=0,g=0,b=0,n=0,tot=0;
 const edge=[];for(let i=0;i<w;i++){edge.push(i,(h-1)*w+i)}for(let j=1;j<h-1;j++){edge.push(j*w,j*w+w-1)}
 edge.forEach(k=>{tot++;const p=k*4;if(d[p+3]<10)return;r+=d[p];g+=d[p+1];b+=d[p+2];n++});
 if(n<tot*.5)return 'sudah';
 r/=n;g/=n;b/=n;const dist=k=>Math.hypot(d[k*4]-r,d[k*4+1]-g,d[k*4+2]-b);
 if(edge.filter(k=>dist(k)<=T*1.5).length<tot*.6)return 'rumit';
 const seen=new Uint8Array(w*h),st=[],tr=k=>{if(!seen[k]&&dist(k)<=T){seen[k]=1;st.push(k)}};
 edge.forEach(tr);
 while(st.length){const k=st.pop(),px=k%w,py=(k/w)|0;if(px>0)tr(k-1);if(px<w-1)tr(k+1);if(py>0)tr(k-w);if(py<h-1)tr(k+w)}

  const px=k%w,py=(k/w)|0;if((px>0&&seen[k-1])||(px<w-1&&seen[k+1])||(py>0&&seen[k-w])||(py<h-1&&seen[k+w])){const a=Math.min(1,Math.max(0,(dist(k)-T)/T));d[k*4+3]=Math.round(d[k*4+3]*a)}}

function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch{}}

 [0,1.3].forEach(off=>[[988,0],[1319,.22],[1568,.44]].forEach(([fr,dl])=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+off+dl;o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.6,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.65)}));
 navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}}
function togMute(){localStorage.setItem('tr_mute',muted()?'0':'1');hdr();if(!muted()){beep(1);toast('Suara pesanan baru: aktif')}else toast('Suara pesanan baru: dimatikan')}

function sortAll(){S.orders.sort((a,b)=>b.ts-a.ts);S.fb.sort((a,b)=>b.ts-a.ts);S.log.sort((a,b)=>b.t-a.t);['cats','menu'].forEach(c=>S[c].sort((a,b)=>(a.o??1e9)-(b.o??1e9)))}
let rT;function softRender(){clearTimeout(rT);rT=setTimeout(()=>{const a=document.activeElement;if($('#md').style.display=='flex'||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return softRender();sortAll();save();render(1)},400)}
const hc=c=>s=>s.docChanges().forEach(ch=>{const d=ch.doc.data(),sh=SY.sh[c]=SY.sh[c]||{};if(ch.type=='removed'){S[c]=S[c].filter(x=>x.id!=d.id);delete sh[d.id];return}const i=S[c].findIndex(x=>x.id==d.id);if(i<0){S[c].push(d);if(SY.live&&SY.staff&&c=='orders'&&d.dev){beep();toast('🔔 Pesanan baru '+d.no+' – '+d.name)}}else{const old=S[c][i];if(SY.live&&!SY.staff&&c=='orders'&&old.status!=d.status)toast(d.status=='Dibatalkan'?'Pesanan '+d.no+' dibatalkan'+(d.alasan?': '+d.alasan:''):'Pesanan '+d.no+' kini: '+d.status);S[c][i]=d}sh[d.id]=cj(d)});
function listen(uid){SY.un.forEach(f=>f());SY.un=[];SY.sh={};SY.ready=0;SY.need=0;SY.live=0;const{F,db}=FB;
 const mk=(q,fn)=>{SY.need++;let first=1;SY.un.push(F.onSnapshot(q,s=>{fn(s);if(first){first=0;SY.ready++;if(SY.ready>=SY.need){SY.st=SY.staff?'online (staf)':'online';push();setTimeout(()=>SY.live=1,1500)}}hdr();softRender()},er=>{SY.st='ditolak: '+er.code;hdr();toast('Sinkron gagal: '+er.code)}))};
 (SY.staff?COLS:['menu','cats','vouch']).forEach(c=>mk(F.collection(db,c),hc(c)));
 if(!SY.staff)mk(F.query(F.collection(db,'orders'),F.where('dev','==',uid)),hc('orders'));
 mk(F.doc(db,'meta','set'),s=>{if(s.exists()){Object.assign(S.set,s.data());SY.sh.set=cj(pub())}});
 if(SY.staff)mk(F.doc(db,'meta','pins'),s=>{if(s.exists()){Object.assign(S.set,s.data());SY.sh.pins=cj(pins())}})}
function push(){if(!FB.db||!SY.need||SY.ready<SY.need)return;const{F,db}=FB,ops=[];
 (SY.staff?COLS:['orders','fb']).forEach(c=>{const sh=SY.sh[c]=SY.sh[c]||{};
  S[c].forEach((x,i)=>{if(c=='vouch'&&!x.id)x.id=x.c;if(c=='cats'||c=='menu')x.o=i;if(!x.id)return;if(!SY.staff&&c=='orders'&&x.dev!=DEV)return;const j=cj(x);if(sh[x.id]!==j){sh[x.id]=j;ops.push(F.setDoc(F.doc(db,c,x.id),JSON.parse(j)))}});
  if(SY.staff&&c!='log')Object.keys(sh).forEach(id=>{if(!S[c].some(x=>x.id==id)){delete sh[id];ops.push(F.deleteDoc(F.doc(db,c,id)))}})});
 if(SY.staff)[['set',pub(),'set'],['pins',pins(),'pins']].forEach(([k,v,d])=>{const j=cj(v);if(SY.sh[k]!==j){SY.sh[k]=j;ops.push(F.setDoc(F.doc(db,'meta',d),JSON.parse(j)))}});
 if(ops.length)Promise.all(ops).catch(er=>{SY.st='gagal kirim: '+er.code;hdr();toast('Gagal kirim: '+er.code)})}

 H.onAuthStateChanged(FB.au,u=>{if(!u){H.signInAnonymously(FB.au).catch(er=>{SY.st='aktifkan Anonymous di Authentication ('+er.code+')';hdr();toast('Sinkron gagal: '+er.code)});return}SY.staff=!!u.email;SY.mail=u.email||'';setDev(u.uid);listen(u.uid)})}catch(x){SY.st='gagal memuat Firebase (cek internet)';hdr()}}

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(p=>{U.persist=p});
IDB.get('S').then(str=>{if(str){const d=JSON.parse(str);if((d._t||0)>(S._t||0)){S=d;S.fb=S.fb||[];S.cart=S.cart||[];try{localStorage.setItem('tr_v1',str)}catch{}render();toast('Data dipulihkan dari penyimpanan cadangan')}}else save()}).catch(()=>{okI=0});
IDB.get('fh').then(h=>{if(h)FH=h}).catch(()=>{});
render();syncInit();
